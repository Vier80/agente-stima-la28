name: Esplora tutti gli sport LA28

# Solo a tuo comando (Actions -> Esplora tutti gli sport LA28 -> Run workflow). Legge soltanto: non scrive nulla.
on:
  workflow_dispatch:

jobs:
  esplora:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa il necessario
        run: pip install -r requirements.txt
      - name: Esplora i database Notion (tutti gli sport)
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python -u esplora_tutti.py
      - name: Conserva il resoconto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esplora-tutti
          path: esplora_tutti.txt
          if-no-files-found: ignore
